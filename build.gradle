plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.spiralmecha'
version = '1.0.0'
base { archivesName = 'SpiralMecha-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { spiralmecha { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.20'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version: '1.20.1', forge_version: '47.2.20',
                             mod_id: 'spiralmecha', mod_name: 'Spiral Mecha',
                             mod_license: 'All Rights Reserved', mod_version: project.version,
                             mod_authors: 'SpiralMecha', mod_description: 'Pilotable Spiral Mecha for Forge 1.20.1']
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'spiralmecha',
            'Specification-Vendor': 'SpiralMecha',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'SpiralMecha'
        ])
    }
}
